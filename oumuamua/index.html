<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23000' stroke='%232b65e2' stroke-width='1.5'/%3E%3Cellipse cx='16' cy='16' rx='11' ry='4' fill='none' stroke='%23c8232a' stroke-width='2' transform='rotate(-24 16 16)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<title>ʻOumuamua</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
canvas{display:block;touch-action:none;max-width:100vmin;max-height:100vmin;width:100vmin;height:100vmin}

/* Mobile: portrait Game Boy-style layout, screen on top, control deck below.
   No rotation required; the device's own orientation is left alone. Desktop
   never gets the .mobile class, so it keeps the plain centred square. */
html.mobile body{justify-content:center;padding-top:env(safe-area-inset-top)}
html.mobile canvas{
  width:min(100vw,calc(100vh - 200px));height:min(100vw,calc(100vh - 200px));
  max-width:100vw;max-height:calc(100vh - 200px);
}
@supports (height:100dvh){html.mobile canvas{width:min(100vw,calc(100dvh - 200px));height:min(100vw,calc(100dvh - 200px));max-height:calc(100dvh - 200px)}}
/* Fixed height, NOT flex-grow, a flex:1 deck claims all remaining vertical
   space even while invisible (visibility:hidden preserves layout), which is
   exactly what was leaving ~40% of the screen as dead black space below the
   play field. This is a bounded control bar, not a space-filler. */
.tc-deck{display:none;width:100%;max-width:520px;height:176px;flex:0 0 auto;
  align-items:center;justify-content:space-between;padding:0 16px calc(env(safe-area-inset-bottom) + 8px);}
html.mobile .tc-deck{display:flex}
.tc-side{display:flex;flex-direction:column;align-items:center;gap:12px}
.tc-row{display:flex;gap:12px}
.tc-btn{
  pointer-events:auto;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;
  width:56px;height:56px;border-radius:50%;border:0;
  border:1.5px solid rgba(140,181,237,.55);background:rgba(43,101,226,.22);
  color:rgba(228,219,240,.85);font-family:"Share Tech Mono","Courier New",monospace;
  font-style:italic;font-weight:bold;font-size:21px;line-height:1;
  display:flex;align-items:center;justify-content:center;padding:0;
  transition:background-color .05s,border-color .05s,color .05s;
}
.tc-btn.big{width:76px;height:76px;font-size:28px;border-color:rgba(200,35,42,.6);background:rgba(200,35,42,.18)}
.tc-btn.small{width:44px;height:44px;font-size:12px;opacity:.6}
.tc-btn.pressed{background:rgba(140,181,237,.55);border-color:#fff;color:#fff}
.tc-btn.big.pressed{background:rgba(200,35,42,.6)}
#btn-pause{position:relative;top:0;opacity:.5}
#btn-pause.pressed{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tc-deck">
  <div class="tc-side">
    <button class="tc-btn" id="btn-thrust" data-act="thrust" aria-label="Thrust">▲</button>
    <div class="tc-row">
      <button class="tc-btn" id="btn-rotL" data-act="left" aria-label="Rotate left">◀</button>
      <button class="tc-btn" id="btn-rotR" data-act="right" aria-label="Rotate right">▶</button>
    </div>
  </div>
  <button class="tc-btn small" id="btn-pause" data-act="pause" aria-label="Pause">II</button>
  <div class="tc-side">
    <div class="tc-row">
      <button class="tc-btn small" id="btn-grav" data-act="push" aria-label="Gravity push">V</button>
      <button class="tc-btn small" id="btn-warp" data-act="warp" aria-label="Warp / shield">C</button>
    </div>
    <button class="tc-btn big" id="btn-fire" data-act="fire" aria-label="Fire">●</button>
  </div>
</div>

// ʻOumuamua · 30 Hz simulation, up to 60 fps drawing · single canvas
const CVS=document.getElementById('c'),G=CVS.getContext('2d',{alpha:false});
const FN='"Share Tech Mono","Courier New",monospace'; // base font
// Detect mobile/touch
const isMobile=/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||window.matchMedia('(pointer:coarse)').matches;
if(isMobile)document.documentElement.classList.add('mobile');
// Canvas is always 680×680 logical pixels; CSS scales it via vmin to fill viewport.
// The backing store is rendered at devicePixelRatio so it stays crisp when the
// vmin box is much larger than 680 physical px (retina phones, large desktop windows).
const S=680;
const DPR=Math.min(window.devicePixelRatio||1,2);
CVS.width=CVS.height=(S*DPR)|0;
G.setTransform(DPR,0,0,DPR,0,0);
// Request fullscreen on mobile on first interaction
let _fsRequested=false;
function requestFS(){
  if(_fsRequested||!isMobile)return;_fsRequested=true;
  const el=document.documentElement;
  const fn=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
  if(fn)fn.call(el).catch(()=>{});
  // No orientation lock, portrait is the native layout, device stays however it's held.
}
const OX=S>>1,OY=S>>1,MAR=30,R=(S>>1)-MAR;
// Menu item spacing, larger on mobile for bigger, easier-to-hit touch targets.
// Shared between the draw functions and tapAt() so taps always land where
// the visible item actually is.
const MENU_SP=isMobile?54:44, PAUSE_SP=isMobile?52:44, OVER_SP=isMobile?50:42;
// Text is drawn in a fixed 680-unit logical space with literal px sizes tuned
// for a desktop-sized canvas. On a phone the canvas physically renders at
// roughly half that scale, so raw literal sizes come out illegibly small.
// fpx() scales every menu font size up for mobile; gameplay HUD text is left
// alone since nothing there needs to be tapped and it's already secondary info.
function fpx(n){return isMobile?Math.round(Math.max(n*1.55,n+8)):n;}
// Row spacing and in-play HUD text get a smaller mobile bump so they still fit inside the disc.
function lsp(n){return isMobile?Math.round(n*1.3):n;}
function hpx(n){return isMobile?Math.round(n*1.3):n;}
// Footer hint line: keyboard wording on desktop, touch wording on phones.
function hint(desk,mob){
  G.textAlign='center';G.textBaseline='middle';
  G.font=`italic ${fpx(isMobile?9:8)}px `+FN;G.fillStyle='rgba(140,181,237,.5)';
  G.fillText(isMobile?mob:desk,OX,isMobile?OY+R*.86:OY+R-22);
}
const TAU=Math.PI*2,rn=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>a+(Math.random()*(b-a))|0;

const SFX_VOL={shot:.3,menuNav:.28,menuSelect:.45,crash:.28,explodeS:.42,explodeM:.55,explodeL:.7,cometEnter:.75,cometDestroy:.9,
  gameOver:.8,destroyed:.8,gravPush:.75,mineDrop:.3,hexMine:.35,ufo:.5,pulserPulse:.45,swallow:.55,tidal:.5,cometHit:.5,multUp:.5};
const SFX_JIT={shot:.06,explodeS:.08,explodeM:.06,explodeL:.05,crash:.1,cometHit:.06,tidal:.08,mineDrop:.08,swallow:.06};
const SFX_GAP={crash:220,tidal:90,swallow:140,cometHit:60,explodeS:60}; // ms between repeats
let AC=null,master=null;
const BUF={},_sfxLast={};
// Browsers only allow audio after a tap or key press, so the mixer starts on the first one
function audioUnlock(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  AC=new C();master=AC.createGain();master.gain.value=vol/10;master.connect(AC.destination);
  for(const k in SFX_DATA){
    const bin=atob(SFX_DATA[k]),u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    AC.decodeAudioData(u.buffer,b=>{BUF[k]=b;},()=>{});
  }
}
document.addEventListener('pointerdown',audioUnlock,true);
document.addEventListener('keydown',audioUnlock,true);
document.addEventListener('touchstart',audioUnlock,true);
function sfx(name){
  if(!vol||!AC||!BUF[name])return;
  if(!CFG.menuSfx&&(name==='menuNav'||name==='menuSelect'))return;
  const now=performance.now();
  if(now-(_sfxLast[name]||0)<(SFX_GAP[name]||45))return; // one copy per burst, not ten stacked
  _sfxLast[name]=now;
  const src=AC.createBufferSource(),g=AC.createGain();src.buffer=BUF[name];
  const j=SFX_JIT[name];if(j)src.playbackRate.value=1+(Math.random()*2-1)*j;
  g.gain.value=SFX_VOL[name]??.6;src.connect(g);g.connect(master);src.start();
}
const SFX={};for(const k in SFX_DATA)SFX[k]=()=>sfx(k);
function playExplode(sz=2){if(sz>=4)SFX.explodeL();else if(sz>=3)SFX.explodeM();else SFX.explodeS();}

// ── Visual mode ───────────────────────────────────────────────────────────────
// Glow comes from one bloom pass over the whole frame (see bloom()). Simple mode,
// an opt-in low-power toggle in Options, skips it.
let simple=false;
// Options. starsMode and guide are 0 full / 1 reduced / 2 off.
let vol=8,lensOn=true,starsMode=0,flashOn=true,guide=0;
// Every other setting in Options lives here; each value indexes that option's choices
const CFG_DEF={glow:2,nebula:1,scan:0,fps:0,shake:2,hitstop:1,slowmo:1,parts:1,anim:1,trail:1,popups:0,combo:1,toasts:1,menuSfx:1,thrust:1,turnEase:1,holdFire:1};
const CFG_N={glow:4,fps:3,shake:3,popups:3};
const CFG={...CFG_DEF};
function setVol(v){vol=v;if(master)master.gain.value=vol/10;}
function addShake(n){if(CFG.shake)shake=Math.max(shake,n*(CFG.shake===1?.45:1));}
function freeze(n){if(CFG.hitstop)hitStop=Math.max(hitStop,n);}
function flash(col,n){if(flashOn){flashCol=col;flashT=Math.max(flashT,n);}}

// ── Key bindings ──────────────────────────────────────────────────────────────
// Every in-play action reads its keys from BINDS (two slots each), editable in
// Options > Key bindings. Menus always answer to arrows / WASD, Enter / Space,
// Esc and Backspace, and Esc always pauses, so no binding can lock you out.
const ACTIONS=[['left','ROTATE LEFT'],['right','ROTATE RIGHT'],['thrust','THRUST'],['fire','FIRE'],['push','GRAVITY PUSH'],['warp','WARP / SHIELD'],['shield','SHIELD'],['pause','PAUSE']];
const BIND_DEF={left:['ArrowLeft','KeyA'],right:['ArrowRight','KeyD'],thrust:['ArrowUp','KeyW'],fire:['Space','KeyJ'],push:['KeyV','KeyK'],warp:['KeyC','KeyL'],shield:['KeyE',''],pause:['KeyX','KeyP']};
const copyBinds=b=>JSON.parse(JSON.stringify(b));
let BINDS=copyBinds(BIND_DEF);
const MENU_KEYS=new Set(['Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','Space','Enter','NumpadEnter','Escape','Backspace','Delete']);
const latch=new Set(); // keys pressed since the last update, so a tap shorter than a tick still counts
const tcAct={};        // actions held on the touch deck
function act(a){
  if(tcAct[a])return true;
  const b=BINDS[a];if(!b)return false;
  for(const k of b)if(k&&(keys[k]||latch.has(k)))return true;
  return false;
}
function actOf(c){if(!c)return null;for(const[a]of ACTIONS)if(BINDS[a].includes(c))return a;return null;}
const KEY_NAMES={ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑',ArrowDown:'↓',Space:'SPACE',Enter:'ENTER',NumpadEnter:'NUM ENTER',Escape:'ESC',Backspace:'BKSP',Delete:'DEL',Tab:'TAB',
  ShiftLeft:'L SHIFT',ShiftRight:'R SHIFT',ControlLeft:'L CTRL',ControlRight:'R CTRL',AltLeft:'L ALT',AltRight:'R ALT',CapsLock:'CAPS',
  Semicolon:';',Quote:"'",Comma:',',Period:'.',Slash:'/',Backslash:'\\',BracketLeft:'[',BracketRight:']',Minus:'-',Equal:'=',Backquote:'`'};
function keyName(c){
  if(!c)return '—';if(KEY_NAMES[c])return KEY_NAMES[c];
  if(c.startsWith('Key'))return c.slice(3);if(c.startsWith('Digit'))return c.slice(5);
  if(c.startsWith('Numpad'))return 'NUM '+c.slice(6).toUpperCase();
  return c.toUpperCase();
}
function ring(x,y,r0,grow,life,col){if(simple)return;particles.push({x,y,vx:0,vy:0,life,col,sz:1,ring:true,rr:r0,grow});}
// Directional spray of short streaks
function sparks(x,y,ang,n,col,sp=4){
  if(simple)return;
  for(let i=0;i<n;i++){const a=ang+rn(-.7,.7),v=rn(sp*.4,sp);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rn(5,11),col,sz:1.3});}
}
function hitFx(b,col){if(b)sparks(b.x,b.y,Math.atan2(-b.vy,-b.vx),4,col||'#fff');}
// Spawn-in and hit-flash scaling for enemies; call right after translate
function fxPre(o,col){
  if(o.born>0){
    const k=o.born/16;
    G.save();G.globalAlpha=k*.8;G.strokeStyle=col;G.lineWidth=1.2;G.beginPath();G.arc(0,0,o.r*(1+k*2.5),0,TAU);G.stroke();G.restore();

function easeBack(t){const u=t-1;return 1+2.7*u*u*u+1.7*u*u;}

// Shatters an entity into flying line-segment fragments
function shatter(x,y,pts,col,speed=3){
  if(simple)return;
  for(let i=0;i<pts.length-1;i++){
    const ax=x+pts[i][0],ay=y+pts[i][1];
    const bx=x+pts[i+1][0],by=y+pts[i+1][1];
    const mx=(ax+bx)/2,my=(ay+by)/2;
    const ang=Math.atan2(my-y,mx-x)+rn(-.4,.4);
    const sp=rn(speed*.5,speed*1.5);
    particles.push({x:mx,y:my,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
      life:rn(28,52),col,sz:1.5,frag:true,
      ax:ax-mx,ay:ay-my,bx:bx-mx,by:by-my,spin:rn(-.18,.18),spinA:0});
  }
}


// ── Starfield ─────────────────────────────────────────────────────────────────
// Three depth layers wheel slowly round the centre in the same sense the rocks
// orbit, the near ones faster, so the sky turns with the disc. Stars twinkle, a
// faint two-armed nebula drifts behind them, and the hole and the push wave bend
// their light. Positions come from the (interpolated) clock, so they move
// smoothly in menus as well as in play.
const STAR_COLS=['#9a82ff','#ff7d9a','#7ddcaa','#8cb5ed','#e4dbf0','#f1e038','#ffffff'];
const STAR_LAYERS=[{n:90,r:[.35,.8],al:[.22,.5],w:.014},{n:46,r:[.6,1.2],al:[.4,.7],w:.026},{n:16,r:[1,1.8],al:[.65,.95],w:.045}];
const STARS=[];
STAR_LAYERS.forEach((L,k)=>{for(let i=0;i<L.n;i++)STARS.push({a0:Math.random()*TAU,d:R*.985*Math.sqrt(Math.random()),k,r:rn(L.r[0],L.r[1]),al:rn(L.al[0],L.al[1]),
  w:L.w*rn(.85,1.15),tw:rn(1.2,3.6),ph:Math.random()*TAU,col:STAR_COLS[k===0?ri(0,4):ri(0,STAR_COLS.length)]});});
// Nebula: soft blobs along two spiral arms, painted once at low resolution
const NEB=(()=>{
  const n=256,h=n/2,c=document.createElement('canvas');c.width=c.height=n;const g=c.getContext('2d');
  const tint=[[43,101,226],[197,35,172],[200,35,42],[140,181,237]];
  for(let arm=0;arm<2;arm++)for(let i=0;i<30;i++){
    const t=i/30,a=arm*Math.PI+t*3.6,d=h*(.08+t*.86),x=h+Math.cos(a)*d,y=h+Math.sin(a)*d,rad=h*(.1+.16*(1-t)),[cr,cg,cb]=tint[(i+arm*2)%4];
    const rg=g.createRadialGradient(x,y,0,x,y,rad);rg.addColorStop(0,`rgba(${cr},${cg},${cb},${.07+.05*(1-t)})`);rg.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
    g.fillStyle=rg;g.fillRect(x-rad,y-rad,rad*2,rad*2);
  }
  const core=g.createRadialGradient(h,h,0,h,h,h*.3);core.addColorStop(0,'rgba(228,219,240,.1)');core.addColorStop(1,'rgba(228,219,240,0)');g.fillStyle=core;g.fillRect(0,0,n,n);
  return c;
})();
function drawStars(alpha,ripple=0,lens=false){
  if(starsMode===2)return;
  if(starsMode===1)alpha*=.55;
  G.save();G.beginPath();G.arc(OX,OY,R,0,TAU);G.clip();
  const t=menuT;
  if(starsMode===0&&!simple&&CFG.nebula){G.save();G.globalAlpha=Math.min(.3,alpha*.75);G.translate(OX,OY);G.rotate(-t*.01);G.drawImage(NEB,-R,-R,R*2,R*2);G.restore();}
  G.lineCap='round';
  for(const s of STARS){
    const a=s.a0-s.w*t;let x=OX+Math.cos(a)*s.d,y=OY+Math.sin(a)*s.d;
    if(ripple){ // push wave shoves stars outward as it passes
      const qx=x-gPX,qy=y-gPY,qd=Math.sqrt(qx*qx+qy*qy)||1,k=1-Math.abs(qd-ripple)/40;
      if(k>0){x+=qx/qd*k*8;y+=qy/qd*k*8;}
    }
    if(lens){let hid=false;for(const b of bodies){const lx=x-b.x,ly=y-b.y,ld=Math.sqrt(lx*lx+ly*ly)||1,lr=b.hr*5;if(ld<b.hr*1.2){hid=true;break;}if(ld<lr){const k=(lr-ld)/lr;x+=lx/ld*k*b.hr*1.6;y+=ly/ld*k*b.hr*1.6;}}if(hid)continue;}
    const tw=simple?1:.68+.32*Math.sin(t*s.tw+s.ph);
    G.globalAlpha=alpha*s.al*tw;G.fillStyle=s.col;
    if(s.r<.9)G.fillRect(x-s.r,y-s.r,s.r*2,s.r*2);
    else{G.beginPath();G.arc(x,y,s.r,0,TAU);G.fill();}
    // The brightest near stars glint as they peak
    if(s.k===2&&tw>.9&&!simple){const gl=2+(tw-.9)*50;G.strokeStyle=s.col;G.lineWidth=.6;G.beginPath();G.moveTo(x-gl,y);G.lineTo(x+gl,y);G.moveTo(x,y-gl);G.lineTo(x,y+gl);G.stroke();}
  }
  G.restore();
}

  for(let k=1;k<3;k++)for(const a of ids[k])ids[k-1].slice().sort((p,q)=>d(a,p)-d(a,q)).slice(0,2).forEach(b=>LINKS.push([b,a]));

function clearedCount(){let n=0;for(let i=0;i<PLANETS.length;i++)if(CAMP[i]&1)n++;return n;}

// ── Central mass ──────────────────────────────────────────────────────────────
// A black hole at the centre of the disc, as in Spacewar!. Everything except the
// comet can fall in. Big rocks are torn apart (and scored) before they reach it.
const RMAXV=[0,2.2,1.9,1.7,1.5,1.3]; // fastest a rock may stray from the orbital flow
// The pull is a Newtonian core plus a flat halo term, like a galaxy's dark matter:
// near the hole it bites hard (dives, slingshots, tidal tears), further out the
// halo keeps orbital speed up so the whole disc actually turns. Circular speed is
// about 1.9 px/tick at r=100 and 1.6 at the rim, a lap every 10-40 seconds.
const GM=160,HALO=1.96,GSOFT=300;

const PULSAR_PERIOD=150,PULSAR_PUSH=45; // the last 45 ticks of each period push outward
function setupBodies(kind){
  bodyKind=kind;bodies=[];pulsarT=0;
  if(kind==='none')return;
  if(kind==='binary'){for(let i=0;i<2;i++)bodies.push({x:OX,y:OY,m:.6,hr:11,ph:i*Math.PI,flare:0});}
  else bodies.push({x:OX,y:OY,m:kind==='heavy'?1.7:1,hr:kind==='heavy'?20:kind==='pulsar'?13:15,ph:0,flare:0});
  updateBodies();
}
function pulsarPushing(){return bodyKind==='pulsar'&&(pulsarT%PULSAR_PERIOD)>=PULSAR_PERIOD-PULSAR_PUSH;}
function updateBodies(){
  if(bodyKind==='binary')for(const b of bodies){b.ph+=.012;b.x=OX+Math.cos(b.ph)*58;b.y=OY+Math.sin(b.ph)*58;}
  if(bodyKind==='pulsar'){pulsarT++;bodies[0].m=pulsarPushing()?-1.4:1;}
  for(const b of bodies)if(b.flare>0)b.flare--;
}
function hasHole(){return bodies.length>0;}
// h scales the halo; drifting pickups and mines leave it out so they don't sink
function grav(o,k,h=1){

    const dx=b.x-o.x,dy=b.y-o.y,d2=dx*dx+dy*dy+GSOFT,d=Math.sqrt(d2),a=b.m*k*(GM/d2+HALO*h/d);

  }

function holeMass(){let m=0;for(const b of bodies)m+=b.m>0?b.m:bodyKind==='pulsar'?1:0;return m;}
// Circular speed at distance d for exactly the softened pull above, so orbit
// assists and spawns agree with gravity instead of fighting it
function circV(d,m){const d2=d*d+GSOFT;return Math.sqrt(m*d*d*(GM/Math.pow(d2,1.5)+HALO/d2));}
// Circular orbit velocity at a point; s picks the direction of travel (+1 / -1)
function orbitV(x,y,s){
  const m=holeMass();if(m<=0)return[0,0];

// Ease toward a circular orbit without stealing angular momentum: radial drift is
// damped by kr, tangential speed eases toward circular by kt. A prograde burn
// raises the orbit and a retrograde burn drops it, as in the real thing.
function circularize(o,kr,kt){
  const m=holeMass();if(m<=0)return;
  const rx=o.x-OX,ry=o.y-OY,d=Math.sqrt(rx*rx+ry*ry)||1,ux=rx/d,uy=ry/d;
  let vr=o.vx*ux+o.vy*uy,vt=o.vy*ux-o.vx*uy;

// The outer band bleeds off outward drift, so a rock flung high turns into a
// wide orbit along the rim instead of wrapping through it
const RIM_BAND=90;
function rimTurn(o){

  const vr=(o.vx*rx+o.vy*ry)/d;if(vr<=0)return;

// ── Orbits ────────────────────────────────────────────────────────────────────
// Laps of the hole are tracked and paid: each full sweep scores (double for a deep

const THR_ACC0=.12,THR_ACC1=.17,THR_RAMP=4,THR_GRIP=.84,THR_CLASSIC=.15;

const START_INV=90,WAVE_INV=30,RESPAWN_INV=300,WARP_INV=300; // respawn and warp keep their full 10 s
let invMax=1;

const SHIP_KR=.985,SHIP_KT=.996,SHIP_VMAX=7,PUSH_SPIN=.6;

// Where the ship will coast with no input: dots fading out ahead, a red ring where
// the path falls in, and a dashed arc round the hole showing this lap's progress
function drawOrbitPath(){
  if(!ship||screensaver||gameMode==='sentry'||!hasHole()||deathT>0)return;
  if(guide===2)return;
  const th=act('thrust'),push=pulsarPushing(),o={x:ship.x,y:ship.y,vx:ship.vx,vy:ship.vy},col=isColor()?P.lav:P.wht;

    grav(o,1);if(!push){circularize(o,SHIP_KR,SHIP_KT);capFlow(o,SHIP_VMAX);}
    o.x+=o.vx;o.y+=o.vy;

function swallowAll(){

function drawBodies(){
  for(const b of bodies){
    const push=bodyKind==='pulsar'&&b.m<0,cyc=pulsarT%PULSAR_PERIOD;
    const warn=bodyKind==='pulsar'&&!push&&cyc>=PULSAR_PERIOD-PULSAR_PUSH-24;
    const fl=b.flare/10,hr=b.hr;
    // Accretion disc: broken arcs, inner ones hotter and faster
    G.lineCap='round';
    for(let k=0;k<6;k++){
      const rr=hr*(1.7+k*.55),sp=1.6/(1+k*.6),a0=menuT*sp*(push?-1:1)+k*1.7;
      G.globalAlpha=Math.min(1,(.55-k*.07)*(1+fl*.6));
      G.strokeStyle=push?P.mag:(k<2?P.yel:k<4?P.red:P.mag);G.lineWidth=k<2?1.6:1.1;
      G.beginPath();G.arc(b.x,b.y,rr,a0,a0+1.6+k*.25);G.stroke();
      G.beginPath();G.arc(b.x,b.y,rr,a0+Math.PI,a0+Math.PI+1.1);G.stroke();
    }
    G.globalAlpha=1;
    // Photon ring, flaring when something falls in; flickers before a pulsar flips
    
    G.strokeStyle=push?P.mag:P.lav;G.lineWidth=1.6+fl;
    G.beginPath();G.arc(b.x,b.y,hr*1.18,0,TAU);G.stroke();
    const br=CFG.anim?1+.035*Math.sin(menuT*1.7+b.ph):1;
    G.fillStyle='#000';G.beginPath();G.arc(b.x,b.y,hr*br,0,TAU);G.fill();
    if(CFG.anim&&!simple){G.save();G.setLineDash([2,7]);G.lineDashOffset=-menuT*14;G.strokeStyle=push?P.mag:P.lav;G.globalAlpha=.3;G.lineWidth=1;G.beginPath();G.arc(b.x,b.y,hr*1.5,0,TAU);G.stroke();G.restore();}
    // Tidal warning: a dashed ring at the tearing distance lights up as a big rock nears it
    if(CFG.anim&&b.m>0){
      let tk=0;for(const r of rocks){if(r.sz<3||r.tc>0)continue;const d=Math.hypot(r.x-b.x,r.y-b.y)-(b.hr*4.5+r.r*.5);tk=Math.max(tk,1-d/70);}
      if(tk>0){G.save();G.setLineDash([6,6]);G.lineDashOffset=menuT*20;G.strokeStyle=tk>.8?P.red:P.yel;G.globalAlpha=Math.min(1,tk)*(.35+.25*Math.sin(menuT*16));G.lineWidth=1.4;G.beginPath();G.arc(b.x,b.y,b.hr*4.5,0,TAU);G.stroke();G.restore();}
    }
    if(push){const ph=(cyc-(PULSAR_PERIOD-PULSAR_PUSH))/PULSAR_PUSH;G.strokeStyle=`rgba(197,35,172,${(1-ph)*.6})`;G.lineWidth=2;G.beginPath();G.arc(b.x,b.y,hr+ph*220,0,TAU);G.stroke();}
  }
}

function captureKey(c){
  bindCap=false;
  if(c==='Escape'||/^(Meta|OS)/.test(c))return;
  const a=ACTIONS[bindSel][0];
  for(const[b,lbl]of ACTIONS)BINDS[b].forEach((k,i)=>{if(k===c&&!(b===a&&i===bindSlot)){BINDS[b][i]='';if(b!==a)bindMsg={txt:keyName(c)+' MOVED FROM '+lbl,t:90};}});

function handleKey(c){
  const up=c==='ArrowUp'||c==='KeyW',down=c==='ArrowDown'||c==='KeyS';
  const left=c==='ArrowLeft'||c==='KeyA',right=c==='ArrowRight'||c==='KeyD';
  const ok=c==='Space'||c==='Enter'||c==='NumpadEnter',back=c==='Escape'||c==='KeyX'||c==='Backspace';
  if(gScreen==='playing'){
    const a=actOf(c);
    if(screensaver){if(a==='push')doGravity();else exitScreensaver();return;}
    if(c==='Escape'||a==='pause'){if(paused)paused=false;else pauseGame();return;}
    if(paused){
      if(up){pauseSel=(pauseSel+2)%3;SFX.menuNav();}
      else if(down){pauseSel=(pauseSel+1)%3;SFX.menuNav();}
      else if(ok)choosePause(pauseSel);
      else if(c==='Backspace')paused=false;
      return;
    }
    doAction(a);
    return;
  }
  if(gScreen==='ach'){
    const n=ACH_DEF.length,c5=ACH_COLS;
    if(up){achSel=(achSel-c5+n)%n;SFX.menuNav();}
    else if(down){achSel=(achSel+c5)%n;SFX.menuNav();}
    else if(left){achSel=(achSel-1+n)%n;SFX.menuNav();}
    else if(right){achSel=(achSel+1)%n;SFX.menuNav();}
    else if(ok||back)backToMenu('extra',3);
    return;
  }
  if(gScreen==='binds'){
    const n=ACTIONS.length+2;
    if(up){bindSel=(bindSel-1+n)%n;SFX.menuNav();}
    else if(down){bindSel=(bindSel+1)%n;SFX.menuNav();}
    else if((left||right)&&bindSel<ACTIONS.length){bindSlot=left?0:1;SFX.menuNav();}
    else if(ok)bindChoose();
    else if((c==='Delete'||c==='Backspace')&&bindSel<ACTIONS.length){BINDS[ACTIONS[bindSel][0]][bindSlot]='';save();SFX.menuNav();}
    else if(c==='Escape'||c==='KeyX')leaveBinds();
    return;
  }
  if(gScreen==='over'){
    if(overT>0)return; // a held fire button can't skip the result screen
    const n=MENUS.over.length;
    if(up){menuSel=(menuSel-1+n)%n;SFX.menuNav();}
    else if(down){menuSel=(menuSel+1)%n;SFX.menuNav();}
    else if(ok){SFX.menuSelect();if(!menuSel){if(RUN)startPlanet(RUN.id);else startGame(gameMode);}else{if(RUN)openMap();else backToMenu(...menuBack);}}
    return;
  }
  if(gScreen==='map'){
    if(back)backToMenu('',0);
    else if(ok){SFX.menuSelect();gScreen='brief';briefSel=unlocked(mapSel)?0:1;}
    else if(up)mapMove(0,-1);else if(down)mapMove(0,1);else if(left)mapMove(-1,0);else if(right)mapMove(1,0);
    return;
  }
  if(gScreen==='brief'){
    if(up||down){briefSel^=1;SFX.menuNav();}
    else if(ok){if(briefSel===1)gScreen='map';else if(unlocked(mapSel)){SFX.menuSelect();startPlanet(mapSel);}}
    else if(back)gScreen='map';
    return;
  }
  if(gScreen==='menu'){
    const items=subMenu?MENUS[subMenu]:MENUS.menu;
    if(up){menuSel=(menuSel-1+items.length)%items.length;SFX.menuNav();}
    else if(down){menuSel=(menuSel+1)%items.length;SFX.menuNav();}
    else if(ok){SFX.menuSelect();chooseMenu(menuSel);}
    else if(back&&subMenu)backToMenu('',subMenu==='modes'?2:3);
    return;
  }
  if(gScreen==='options'){
    const rows=optRows(),r=rows[optSel];
    if(up){optSel=(optSel-1+rows.length)%rows.length;SFX.menuNav();}
    else if(down){optSel=(optSel+1)%rows.length;SFX.menuNav();}
    else if((left||right)&&r==='tab')switchTab(left?-1:1);
    else if(c==='Tab')switchTab(1);
    else if((left||right)&&(r==='vol'||OPT[r]&&OPT[r].vals))optStep(r,left?-1:1);
    else if(ok)chooseOption(optSel);
    else if(back)leaveOptions();
    return;
  }
  if(gScreen==='scores'){
    if(left){scoreSel=(scoreSel+4)%5;SFX.menuNav();}
    else if(right){scoreSel=(scoreSel+1)%5;SFX.menuNav();}
    else if(ok||back)backToMenu('extra',1);
    return;
  }
  if(ok||back)backToMenu('extra',gScreen==='stats'?2:gScreen==='credits'?6:gScreen==='ach'?3:5); // stats / controls / credits
}

function pickAt(x,y){

  if(gScreen==='menu'){const L=menuLayout(),i=hitRow(y,L.start,MENU_SP,L.items.length);return i>=0&&inCol?{k:'menu',i}:null;}
  if(gScreen==='map'){let hit=-1,bd=26*26;NODES.forEach((N,i)=>{const d=(N.x-x)**2+(N.y-y)**2;if(d<bd){bd=d;hit=i;}});return hit>=0?{k:'map',i:hit}:null;}

function mkShip(){
  const s={x:OX,y:OY,vx:0,vy:0,a:-Math.PI/2,r:10,born:20,muzzle:0};
  // With a hole at the centre, start low in the disc already in orbit
  if(hasHole()&&gameMode!=='sentry'){s.y=OY+(gameMode==='quarantine'&&qRing.active?Math.min(R-30,Math.max(R*.55,qRing.r+40)):R*.55);const o=orbitV(s.x,s.y,-1);s.vx=o[0];s.vy=o[1];s.a=Math.atan2(o[1],o[0]);}
  return s;
}
function mkRock(x,y,sz,pvx,pvy){
  const a=pvx!=null?Math.atan2(pvy,pvx)+rn(.5,Math.PI-.5):Math.random()*TAU;
  const sp=SZ_SPD[sz]*rn(.9,1.4),rad=SZ_R[sz],pts=[],n=ri(7,12);
  for(let i=0;i<n;i++){const t=i/n*TAU,d=rad+rn(-rad*.24,rad*.24);pts.push([Math.cos(t)*d,Math.sin(t)*d]);}
  const ci=ri(0,TINTS.length);
  return{x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,sz,pts,r:rad,col:isColor()?TINTS[ci]:P.wht,eT:null,
    rot:Math.random()*TAU,spin:rn(-1,1)*(.006+.05/sz),born:0,flash:0,pf:0};
}
function split(r){
  const rad=SZ_R[r.sz-1],pa=Math.atan2(r.vy,r.vx)+Math.PI/2,off=rad+7;
  const a=mkRock(r.x+Math.cos(pa)*off,r.y+Math.sin(pa)*off,r.sz-1,r.vx,r.vy);
  const b=mkRock(r.x-Math.cos(pa)*off,r.y-Math.sin(pa)*off,r.sz-1,r.vx,-r.vy);
  a.vx+=Math.cos(pa)*.8;a.vy+=Math.sin(pa)*.8;b.vx-=Math.cos(pa)*.8;b.vy-=Math.sin(pa)*.8;
  if(hasHole()){a.vx=r.vx+Math.cos(pa)*.6;a.vy=r.vy+Math.sin(pa)*.6;b.vx=r.vx-Math.cos(pa)*.6;b.vy=r.vy-Math.sin(pa)*.6;}
  a.flash=b.flash=4;a.tc=b.tc=10;a.spin+=r.spin*.5;b.spin-=r.spin*.5;
  return[a,b];
}
function spawnRocks(n){
  for(let i=0;i<n;i++){
    const c5=rocks.reduce((c,r)=>c+(r.sz===5),0);
    // Wave 1 is the warm-up: one boulder to tear apart, the rest mid-sized
    let sz=level===1?(i===0?5:3):level<=2?Math.random()<.4?5:3:level<=4?ri(3,6):Math.random()<.3?5:ri(3,5);
    sz=Math.min(sz,5);if(sz===5&&c5>=2)sz=4;
    if(RUN&&RUN.p.rocks&&level===1)sz=RUN.p.rocks[i%RUN.p.rocks.length]; // timed planets use a fixed field
    const rr=SZ_R[sz];let x,y,t=0;
    // With a hole, rocks start in an orbit band clear of its tidal reach and (in Sentry) of the rim
    const lo=hasHole()?Math.max(...bodies.map(b=>b.hr*4.5))+rr*.5+30:160+rr,hi=R-rr-(gameMode==='sentry'?70:24);
    do{const a=Math.random()*TAU,d=hasHole()?rn(lo,Math.max(lo+1,hi)):rn(rr+12,R-rr-12);x=OX+Math.cos(a)*d;y=OY+Math.sin(a)*d;}
    while(++t<50&&((!hasHole()&&(x-OX)**2+(y-OY)**2<(160+rr)**2)||(ship&&(x-ship.x)**2+(y-ship.y)**2<(110+rr)**2)));
    const nr=mkRock(x,y,sz,null,null);
    if(hasHole()){const o=orbitV(x,y,Math.random()<.92?-1:1),k=rn(.92,1.04);nr.vx=o[0]*k+rn(-.15,.15);nr.vy=o[1]*k+rn(-.15,.15);}nr.born=18+i*3;nr.rim=1;rocks.push(nr); // staggered arrival
  }
}
function spawnPUAt(){let x,y,t=0;do{const a=Math.random()*TAU,d=rn(50,R-32);x=OX+Math.cos(a)*d;y=OY+Math.sin(a)*d;}while(++t<12&&ship&&(x-ship.x)**2+(y-ship.y)**2<70*70);return{x,y,r:10,p:0,vx:0,vy:0,born:14};}

function fireBullet(){
  if(!ship||sentryReadyT>0||(RUN&&RUN.p.noFire))return;
  if(gameMode==='sweep'){
    const toDetonate=[...activeMines];activeMines=[];
    toDetonate.forEach(m=>mineBlast(m.x,m.y));return;
  }
  if(bullets.length>=(RUN&&RUN.p.maxB||8))return;
  const a=ship.a,px=Math.sin(a)*1.8,py=-Math.cos(a)*1.8;
  const spd=9;

  bullets.push({x:ship.x+Math.cos(a)*12,y:ship.y+Math.sin(a)*12,vx:ship.vx+Math.cos(a)*spd,vy:ship.vy+Math.sin(a)*spd,a,life:30,trail:[],px,py,wr:false});
  // Spread shots (arcade only, when active)
  if(spreadT>0&&gameMode==='arcade'){
    const spread=.32; // ~18 degrees
    for(const off of[-spread,spread]){
      const sa=a+off;
      bullets.push({x:ship.x+Math.cos(sa)*12,y:ship.y+Math.sin(sa)*12,vx:ship.vx+Math.cos(sa)*spd,vy:ship.vy+Math.sin(sa)*spd,a:sa,life:28,trail:[],px:Math.sin(sa)*1.8,py:-Math.cos(sa)*1.8,wr:false});
    }

}

// ── Update ────────────────────────────────────────────────────────────────────
function update(){
  if(gScreen!=='playing'||paused)return;
  if(deathT>0&&--deathT===0){endGame();return;}
  // Wave intermission: a short beat, then the next wave arrives
  checkGoal();
  // Running totals for the score and multiplier achievements
  if(!RUN){if(gameMode==='arcade')achProg('score25',score);if(gameMode==='purist')achProg('purist',score);achProg('score100',score);}
  achProg('mult8',mult);
  if(waveT>0&&--waveT===0){
    level++;waveSweep=26;
    if(!waveDied){cleanWaves++;achProg('clean3',cleanWaves);}waveDied=false;
    if(gameMode==='arcade'&&!RUN){if(level>=2)ach('wave1');achProg('wave5',level);achProg('wave10',level);}
spawnRocks(waveSize());if(!screensaver)setInv(WAVE_INV);if(gameMode==='quarantine')resetQRing();}
  // Sentry respawn countdown
  if(sentryReadyT>0){
    sentryReadyT--;
    if(sentryReadyT===29)SFX.ready();else if(sentryReadyT===14)SFX.go();
    if(sentryReadyT===0){
      // Respawn at bottom centre
      sentryAngle=Math.PI/2;
      ship=mkShip();
      const sr=R-ship.r-2;
      ship.x=OX+Math.cos(sentryAngle)*sr;
      ship.y=OY+Math.sin(sentryAngle)*sr;
      ship.a=sentryAngle+Math.PI;
      ship.vx=0;ship.vy=0;
      setInv(60);
    }
  }

  // Screensaver: periodic auto gravity push from centre
  if(screensaver&&gCd<=0){gCd=GCD;gPulse=30;gPX=OX;gPY=OY;
    const pushC=(o)=>{const dx=o.x-OX,dy=o.y-OY,d=Math.sqrt(dx*dx+dy*dy)||1;if(d<220){const f=2.5*(1-d/220);o.vx+=dx/d*f;o.vy+=dy/d*f;}};rocks.forEach(pushC);comets.forEach(pushC);activeMines.forEach(pushC);}
  if(ship&&!screensaver){
    if(gameMode==='sentry'){
      // Rotate around field edge with L/R
      if(act('left'))sentryAngle-=.045;
      if(act('right'))sentryAngle+=.045;
      sentryAngle=((sentryAngle%TAU)+TAU)%TAU;
      const sr=R-ship.r-2;
      ship.x=OX+Math.cos(sentryAngle)*sr;
      ship.y=OY+Math.sin(sentryAngle)*sr;
      ship.a=sentryAngle+Math.PI; // always points toward centre
      ship.vx=0;ship.vy=0;
    } else {
      // Turning eases in: a tap nudges a couple of degrees for fine aim, a hold
      // ramps to full speed within a few ticks
      const rl=act('left'),rr=act('right');
      if(rl!==rr){ship.rh=(ship.rh||0)+1;const rs=CFG.turnEase?ROT_MIN+(ROT_MAX-ROT_MIN)*Math.min(1,(ship.rh-1)/ROT_RAMP):ROT_FLAT;ship.a+=rl?-rs:rs;}else ship.rh=0;
      if(act('thrust')){
        const hx=Math.cos(ship.a),hy=Math.sin(ship.a);ship.th=Math.min(THR_RAMP,(ship.th||0)+1);
        if(CFG.thrust){
          let fx=0,fy=0;if(hasHole()&&!pulsarPushing()){const L=(ship.x-OX)*ship.vy-(ship.y-OY)*ship.vx,f=orbitV(ship.x,ship.y,L>=0?1:-1);fx=f[0];fy=f[1];}
          const rx=ship.vx-fx,ry=ship.vy-fy,al=rx*hx+ry*hy,pe=(ry*hx-rx*hy)*THR_GRIP,ac=THR_ACC0+(THR_ACC1-THR_ACC0)*ship.th/THR_RAMP;
          ship.vx=fx+hx*(al+ac)-hy*pe;ship.vy=fy+hy*(al+ac)+hx*pe;
        }else{ship.vx+=hx*THR_CLASSIC;ship.vy+=hy*THR_CLASSIC;}
      }else ship.th=0;
      if(hasHole()&&!pulsarPushing()){const th=act('thrust');circularize(ship,th?.996:SHIP_KR,th?1:SHIP_KT);capFlow(ship,SHIP_VMAX);}
      else{ship.vx*=.985;ship.vy*=.985;}
      ship.x+=ship.vx;ship.y+=ship.vy;wrapO(ship);
      ship.bank=(ship.bank||0)+((rl&&!rr?-1:rr&&!rl?1:0)-(ship.bank||0))*.3;
      // Trail: recent positions, broken where the ship wraps or warps
      const tr=ship.trail||(ship.trail=[]),lp=tr[0];if(lp&&(lp.x-ship.x)**2+(lp.y-ship.y)**2>2500)tr.length=0;
      tr.unshift({x:ship.x,y:ship.y,th:!!act('thrust')});if(tr.length>22)tr.pop();
    }
    // Thrust trail
    if(act('thrust')&&gameMode!=='sentry'&&!simple&&Math.random()<.55){
      const ta=ship.a+Math.PI+rn(-.3,.3);const ts=rn(.4,1.6);
      particles.push({x:ship.x-Math.cos(ship.a)*10,y:ship.y-Math.sin(ship.a)*10,vx:Math.cos(ta)*ts,vy:Math.sin(ta)*ts,life:rn(4,10),col:isColor()?P.red:P.wht,sz:rn(.6,1.4)});
    }
  }
  if(invT>0)invT--;
  if(gameMode==='purist'||gameMode==='sentry'){if(warpCd>0&&--warpCd===0)wReady=14;}
  if(gameMode!=='purist'){if(gCd>0){gCd--;if(gameMode==='sweep'&&gCd>0)gCd--;if(gCd===0&&!screensaver)gReady=14;}} // gCd ticks in sentry too
  if(gPulse>0)gPulse--;if(multT>0)multT--;if(spreadT>0)spreadT--;if(multFlash>0)multFlash--;
  if(shieldActive){shieldT--;if(shieldT<=0)shieldActive=false;}
  shootCd--;
  if(act('fire')&&CFG.holdFire&&shootCd<=0&&ship)fireBullet(),shootCd=12;
  if(inBuf.push>0){inBuf.push--;if(gCd<=0){inBuf.push=0;doGravity();}}
  if(inBuf.warp>0){inBuf.warp--;if(warpCd<=0){inBuf.warp=0;doPuristWarp();}}

  // Mine drop (arcade w/ mines / sweep)
  if(gameMode!=='purist'&&gameMode!=='sentry'){
    const canDrop=gameMode==='sweep'||(minesH>0);
    const dropCd=gameMode==='sweep'?22:MPC;
    if(ship&&canDrop&&mPlaceCd<=0&&act('thrust')){
      activeMines.push({x:ship.x-Math.cos(ship.a)*18,y:ship.y-Math.sin(ship.a)*18,r:MR2,life:MF,armed:false,ac:MA,vx:0,vy:0,own:true});
      SFX.mineDrop();STATS.minesPlaced++;if(gameMode!=='sweep')minesH--;mPlaceCd=dropCd;
    }
    if(mPlaceCd>0)mPlaceCd--;
  }

  // D6 roll timer: comets, pickups and enemies (every mode except Purist)
  if(gameMode!=='purist'){
    if(--cRT<=0){
      cRT=150;const roll=ri(1,7),eOK=enemyRamp();
      // Comet: roll 6 always; also roll 3 if player has 4+ lives OR score >= 60000
      const cometBonus=lives>=4||score>=60000;
      const cr=RUN&&RUN.p.comets!==undefined?RUN.p.comets:1;
      if(cr>0&&eOK&&(roll===6||(cometBonus&&roll===3)||(cr>1&&roll===4)))spawnComet();
      if(roll===3&&!cometBonus&&!screensaver&&eOK&&allowE('swirl')&&(gameMode==='arcade'||gameMode==='sweep'||gameMode==='sentry')){const sp=spawnPUAt();spawnSwirl(sp.x,sp.y);}
      // Warp PU: independent of comet logic
      const onField=hypPUs.length;
      if(!screensaver&&pickupsOn()&&gameMode!=='sentry'&&((onField<4&&roll%2===0)||(onField>=4&&roll===3)))hypPUs.push(spawnPUAt());
      // Roll 1: hex in non-purist (otherwise spread PU in arcade if no hex on field)
      if(roll===1){
        if(eOK&&allowE('hex')&&hexes.length<(screensaver?2:3))spawnHex();
        else if(!screensaver&&pickupsOn()&&gameMode==='arcade'&&spreadT<=0&&spreadPUs.length===0&&hexes.length===0)spreadPUs.push(spawnPUAt());
      }
      if(!screensaver&&pickupsOn()&&gameMode==='arcade'&&spreadT<=0&&spreadPUs.length===0&&hexes.length===0&&roll===4)spreadPUs.push(spawnPUAt());
      if((gameMode==='arcade'||gameMode==='sweep'||gameMode==='sentry')&&roll===5&&eOK&&allowE('ufo'))spawnUFO();

        if(!trig&&ship&&(ship.x-m.x)**2+(ship.y-m.y)**2<(MBR*.6)**2)trig=true;
        // Chain: check other armed/det mines
        if(!trig)for(const m2 of activeMines)if(m2!==m&&m2.armed&&(m2.x-m.x)**2+(m2.y-m.y)**2<(MBR*2)**2)trig=true;
        if(trig){
          mineBlast(m.x,m.y);
          activeMines.splice(mi,1);
          chainPass=true; // re-run pass since blast may arm new mines
          break;
        }
      }
    }
    activeMines=activeMines.filter(m=>m.life>0);
    minePUs=minePUs.filter(p=>{p.p+=.07;p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;wrapO(p);if(ship&&(ship.x-p.x)**2+(ship.y-p.y)**2<(ship.r+14)**2){minesH=Math.min(minesH+5,10);SFX.collectMine();burst(ship.x,ship.y,10,P.yel);ring(ship.x,ship.y,30,-2.4,10,P.yel);return false;}return true;});
    hypPUs=hypPUs.filter(p=>{p.p+=.06;p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;wrapO(p);if(ship&&(ship.x-p.x)**2+(ship.y-p.y)**2<(ship.r+13)**2){const was=hyperC;hyperC=Math.min(hyperC+1,5);if(hyperC===5&&was<5)SFX.shield();else SFX.collectWarp();burst(ship.x,ship.y,10,P.sky);ring(ship.x,ship.y,30,-2.4,10,P.sky);return false;}return true;});
  spreadPUs=spreadPUs.filter(p=>{p.p+=.05;p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;wrapO(p);if(ship&&(ship.x-p.x)**2+(ship.y-p.y)**2<(ship.r+14)**2){spreadT=SPREAD_DUR;SFX.collectSpread();burst(ship.x,ship.y,10,P.red);ring(ship.x,ship.y,30,-2.4,10,P.red);return false;}return true;});
    activeMines=activeMines.filter(m=>{for(let i=nb.length-1;i>=0;i--)if((nb[i].x-m.x)**2+(nb[i].y-m.y)**2<(m.r+3)**2){nb.splice(i,1);mineBlast(m.x,m.y);return false;}return true;});
  }

  // Bullets vs rocks
  const nr=[],fb=nb,dst=new Set();
  rocks.forEach((r,ri2)=>{
    if(r.eT!=null){r.eT--;if(r.eT<=0){dst.add(ri2);burst(r.x,r.y,7,r.col);playExplode();return;}}
    for(let i=fb.length-1;i>=0;i--){
      if((fb[i].x-r.x)**2+(fb[i].y-r.y)**2<r.r*r.r){
        hitFx(fb[i],r.col);fb.splice(i,1);dst.add(ri2);burst(r.x,r.y,r.sz*3+3,r.col,r.sz>2);playExplode(r.sz);
        if(r.sz>=4){addShake(r.sz===5?5:3);if(CFG.anim){ring(r.x,r.y,r.r*.5,6,14,r.col);ring(r.x,r.y,r.r*.3,3.5,10,'#fff');}}
        statRock(r.sz);
        const pts=(SZ_PTS[r.sz]||5)*(gameMode==='purist'?1:mult);
        score+=pts;scoreVel+=pts;scoreVelT=18;
        streak++;streakT=45; // 1.5s streak window
        // Popup colour scales with streak depth
        let popCol;
        if(streak>=5&&isColor()){
          const ph=(menuT*80+streak*40)%360;
          popCol=`hsl(${ph},90%,72%)`;
        }else if(streak>=3){popCol=P.sky;}else{popCol=r.col;}
        popup(r.x,r.y-r.r,'+'+pts,popCol);
        if(r.sz>1)nr.push(...split(r));break;
      }
    }
  });

  // Rock-rock elastic
  for(let i=0;i<rocks.length;i++){
    if(dst.has(i))continue;
    for(let j=i+1;j<rocks.length;j++){
      if(dst.has(j))continue;
      const a=rocks[i],b=rocks[j];if(a.sz===1&&b.sz===1)continue;
      const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,sr=a.r+b.r;
      if(!d2||d2>sr*sr)continue;
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,dv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
      if(dv<=0)continue;
      const ma=a.r*a.r,mb=b.r*b.r,mt=ma+mb,im=2*dv/mt;
      a.vx-=im*mb*nx;a.vy-=im*mb*ny;b.vx+=im*ma*nx;b.vy+=im*ma*ny;
      const ov=(sr-d)*.5;a.x-=nx*ov*(mb/mt);a.y-=ny*ov*(mb/mt);b.x+=nx*ov*(ma/mt);b.y+=ny*ov*(ma/mt);
      if(a.sz===1&&!dst.has(i)){dst.add(i);burst(a.x,a.y,5,a.col);}
      if(b.sz===1&&!dst.has(j)){dst.add(j);burst(b.x,b.y,5,b.col);}
      // Only real impacts clank and spark; rocks sharing an orbit nudge each other constantly
      if(dv>.6){SFX.crash();sparks(a.x+nx*a.r,a.y+ny*a.r,Math.atan2(ny,nx)+Math.PI/2*(Math.random()<.5?1:-1),3,'#fff',2.5);}
    }
  }
  rocks.forEach((r,ri2)=>{if(!dst.has(ri2))nr.push(r);});
  rocks=nr;bullets.splice(0,bullets.length,...fb);

  if(ship){
    const hits=[];rocks.forEach((r,ri3)=>{if((ship.x-r.x)**2+(ship.y-r.y)**2<(ship.r+r.r)**2)hits.push(ri3);});
    if(hits.length){
      if(shieldActive){const newFrags=[];hits.sort((a,b)=>b-a).forEach(ri3=>{const r=rocks[ri3];burst(r.x,r.y,r.sz*2+2,r.col);statRock(r.sz);streak++;streakT=45;const pts=(SZ_PTS[r.sz]||5)*mult;score+=pts;popup(r.x,r.y-r.r,'+'+pts,r.col);playExplode();if(r.sz>1)newFrags.push(...split(r));rocks.splice(ri3,1);});rocks.push(...newFrags);}
      else if(invT===0)killShip();
    }
  }
  // Endless modes don't make you hunt the last few pebbles: once only a few small
  // stragglers remain, their fuses are lit and the next wave rolls in over them
  if(!RUN&&!screensaver&&rocks.length&&rocks.length<=3&&waveT===0&&deathT===0&&rocks.every(r=>r.sz<=2)&&rocks.reduce((a,r)=>a+r.sz,0)<=4){
    rocks.forEach(r=>{if(r.eT==null||r.eT>150)r.eT=ri(60,150);});
    waveT=50;banner={txt:'WAVE '+(level+1),t:50,max:50};
  }
  if(!rocks.length&&waveT===0&&deathT===0){
    if(RUN&&!RUN.done){RUN.cleared++;if(RUN.p.goal[0]==='clear'&&RUN.cleared>=RUN.p.goal[1])finishRun(true);}
    if(!(RUN&&RUN.done)){waveT=50;if(!screensaver)banner={txt:'WAVE '+(level+1),t:50,max:50};}
  }

  if(!simple){
    particles=particles.filter(p=>{
      if(p.ring){p.rr+=p.grow;p.grow*=.88;return--p.life>0;}
      if(p.frag){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.spinA+=p.spin;return--p.life>0;}
      p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;return--p.life>0;
    });
    const pcap=CFG.parts?170:70;if(particles.length>pcap)particles.splice(0,particles.length-pcap); // drop oldest, not newest
  }else particles=[];
  popups=popups.filter(p=>{p.x+=p.vx||0;p.y+=p.vy;return--p.life>0;});
  flashRings=flashRings.filter(f=>{f.r+=((f.maxR-f.r)*.25);return--f.life>0;});

  if(streakT>0){streakT--;}else if(streak>0){streak=0;}
  // Score velocity (combo tracker)
  if(scoreVelT>0)scoreVelT--;else if(scoreVel>0)scoreVel=Math.max(0,scoreVel-5);
}


// Counts down every short-lived animation timer. Runs during hit-stop too, so
// flashes keep fading while the action is frozen.
function ageFx(){
  const dec=o=>{if(o.hit>0)o.hit--;if(o.born>0)o.born--;};
  comets.forEach(dec);ufos.forEach(dec);pulsers.forEach(dec);hexes.forEach(dec);swirls.forEach(dec);
  minePUs.forEach(dec);hypPUs.forEach(dec);spreadPUs.forEach(dec);
  for(const r of rocks){if(r.flash>0)r.flash--;if(r.pf>0)r.pf--;if(r.born>0)r.born--;}
  if(ship){if(ship.born>0)ship.born--;if(ship.muzzle>0)ship.muzzle--;if(ship.rec>0)ship.rec--;}
  if(waveSweep>0)waveSweep--;
  if(flashT>0)flashT--;if(gReady>0)gReady--;if(wReady>0)wReady--;if(lifeGain>0)lifeGain--;if(lifeLost>0)lifeLost--;
  if(qRing.hitFx>0)qRing.hitFx--;
  if(achToasts.length&&++achToasts[0].t>120)achToasts.shift();
  warpFx=warpFx.filter(w=>--w.t>0);
  if(banner&&--banner.t<=0)banner=null;
  shownScore+=(score-shownScore)*.3;if(Math.abs(score-shownScore)<1)shownScore=score;
  if(shake>0){shake*=.72;if(shake<.15)shake=0;shakeX=shake>0?rn(-shake,shake):0;shakeY=shake>0?rn(-shake,shake):0;}
}
function drawBanner(){
  if(!banner)return;
  const k=banner.t/banner.max,a=Math.max(0,Math.min(1,(1-k)/.2,k/.3));
  G.save();G.globalAlpha=a;G.textAlign='left';G.textBaseline='middle';
  G.font=`bold italic ${hpx(28)}px `+FN;
  const tr=hpx(5)+(1-k)*hpx(5);let w=-tr;for(const ch of banner.txt)w+=G.measureText(ch).width+tr;

  G.strokeStyle=P.lav;G.globalAlpha=a*.4;G.lineWidth=1;
  const uw=w*.5*Math.min(1,(1-k)/.35);G.beginPath();G.moveTo(OX-uw,y+hpx(20));G.lineTo(OX+uw,y+hpx(20));G.stroke();

// ── Rim lens ──────────────────────────────────────────────────────────────────
// The rim behaves like a gravity lens. The world is drawn a little past the edge,
// then the outer band is redrawn in thin rings, each sampling the frame from
// further out: things approaching the rim squash into an arc along it, dragged a
// touch in the orbital direction, and a faint second image of them shows on the
// far side, which is where they will come back in.
const LENS_BAND=64,LENS_OUT=42,LENS_N=14,LENS_TWIST=.05;
const LC=document.createElement('canvas');LC.width=LC.height=CVS.width;const LCg=LC.getContext('2d',{alpha:false});
function lensActive(){return lensOn&&!simple&&!lowFx();}
function rimLens(){
  LCg.drawImage(CVS,0,0);
  G.save();G.setTransform(DPR,0,0,DPR,0,0);
  const R0=R-LENS_BAND,tw=LENS_TWIST*(1+.3*Math.sin(menuT*.7));
  for(let i=0;i<LENS_N;i++){
    const r1=R0+LENS_BAND*i/LENS_N,r2=R0+LENS_BAND*(i+1)/LENS_N,t=((r1+r2)/2-R0)/LENS_BAND;
    const src=R0+LENS_BAND*t+LENS_OUT*Math.pow(t,2.5),sc=(r1+r2)/2/src;
    G.save();G.beginPath();G.arc(OX,OY,r2+.6,0,TAU);G.arc(OX,OY,r1,0,TAU,true);G.clip();
    G.translate(OX,OY);G.rotate(-tw*t*t);G.scale(sc,sc);G.translate(-OX,-OY);
    G.drawImage(LC,0,0,S,S);
    const ga=.38*t*t;
    if(ga>.02){G.globalCompositeOperation='lighter';G.globalAlpha=ga;G.translate(OX,OY);G.rotate(Math.PI);G.translate(-OX,-OY);G.drawImage(LC,0,0,S,S);}
    G.restore();
  }
  // Clear the strip past the rim that only existed to feed the lens
  G.fillStyle='#000';G.beginPath();G.arc(OX,OY,R+LENS_OUT+4,0,TAU);G.arc(OX,OY,R,0,TAU,true);G.fill();
  G.restore();
}

  }

  // Gravity wells
  gWells.forEach(w=>{const fr=w.life/w.ml,al=fr<.3?fr/.3:1;G.globalAlpha=al;G.strokeStyle=P.red;G.lineWidth=1.6;G.beginPath();G.arc(w.x,w.y,WR,0,TAU);G.stroke();G.fillStyle='rgba(200,35,42,.05)';G.beginPath();G.arc(w.x,w.y,WR,0,TAU);G.fill();G.strokeStyle=`rgba(200,35,42,${.4*fr})`;G.lineWidth=1.1;for(let i=0;i<WSN;i++){const a=w.sa+i/WSN*TAU;G.beginPath();G.moveTo(w.x+Math.cos(a)*WR,w.y+Math.sin(a)*WR);G.lineTo(w.x+Math.cos(a)*WSR,w.y+Math.sin(a)*WSR);G.stroke();}G.strokeStyle=`rgba(200,35,42,${.12*fr})`;G.lineWidth=.6;G.beginPath();G.arc(w.x,w.y,WR*5.5,0,TAU);G.stroke();G.strokeStyle=`rgba(200,35,42,${.55*fr})`;G.lineWidth=1.2;for(let k=0;k<7;k++){const ph=(menuT*.5+k/7)%1,rd=WR*5.5*(1-ph)+WR*ph*.4,an=w.sa*2+k*.9+ph*3.2,an2=an+.25,rd2=rd*.85;G.beginPath();G.moveTo(w.x+Math.cos(an)*rd,w.y+Math.sin(an)*rd);G.lineTo(w.x+Math.cos(an2)*rd2,w.y+Math.sin(an2)*rd2);G.stroke();}G.globalAlpha=1;});

    }

    G.strokeStyle=P.red;G.lineWidth=1.4;G.beginPath();G.arc(OX,OY,R+16,sa,ea);G.stroke();
    
  }

  // Gravity/warp arc, purist AND sentry share the warp arc
  if(gameMode==='purist'||gameMode==='sentry'){
    // White warp recharge arc
    const wpct=warpCd<=0?1:1-warpCd/WARP_CD;
    if(wpct>0){
      const sa=-Math.PI/2,ea=sa+TAU*wpct;
      
      G.strokeStyle=wpct>=1?P.wht:`rgba(255,255,255,.6)`;G.lineWidth=wpct>=1?5:3;
      G.beginPath();G.arc(OX,OY,R,sa,ea);G.stroke();
      G.strokeStyle=P.wht;G.lineWidth=1.4;G.beginPath();G.arc(OX,OY,R,sa,ea);G.stroke();
    }
  }
  if(wReady>0){const k=wReady/14;G.strokeStyle=`rgba(255,255,255,${k})`;G.lineWidth=2;G.beginPath();G.arc(OX,OY,R+(1-k)*14,0,TAU);G.stroke();}
  // Gravity arc, mag, for all non-purist modes
  // In sentry: drawn at R+10 to not overlap with the white warp arc at R
  if(gameMode!=='purist'){
    const gpct=gCd<=0?1:1-gCd/gMax;
    if(gpct>0){
      const sa=-Math.PI/2,ea=sa+TAU*gpct;
      const gArcR=gameMode==='sentry'?R+10:R; // sentry: offset so both arcs visible
      
      G.strokeStyle=gCd<=0?P.mag:`rgba(197,35,172,.65)`;G.lineWidth=gCd<=0?6:4;
      G.beginPath();G.arc(OX,OY,gArcR,sa,ea);G.stroke();
      G.strokeStyle=P.mag;G.lineWidth=1.4;
      G.beginPath();G.arc(OX,OY,gArcR,sa,ea);G.stroke();
    }

    if(gReady>0){const k=gReady/14,gr=gameMode==='sentry'?R+10:R;G.strokeStyle=`rgba(197,35,172,${k})`;G.lineWidth=2;G.beginPath();G.arc(OX,OY,gr+(1-k)*14,0,TAU);G.stroke();}
    // Shield segments (green ring), arcade/sweep/quarantine only
    if(gameMode!=='sentry'){
      const segGap=0.04;
      for(let i=0;i<5;i++){const sa2=-Math.PI/2+i/5*TAU+segGap*.5,ea2=-Math.PI/2+(i+1)/5*TAU-segGap*.5;const lit=shieldActive?(shieldT/SHIELD_MAX>1-(i+1)/5):hyperC>i;if(!lit&&hyperC<=i&&!shieldActive)continue;G.strokeStyle=lit?P.grn:P.grn+'44';G.lineWidth=lit?4:2;G.beginPath();G.arc(OX,OY,R+8,sa2,ea2);G.stroke();}
    }
  }

  // Sentry respawn overlay
  if(gameMode==='sentry'&&sentryReadyT>0&&!screensaver){
    G.save();G.beginPath();G.arc(OX,OY,R,0,TAU);G.clip();
    G.fillStyle='rgba(0,0,0,.5)';G.fillRect(0,0,S,S);
    const msg=sentryReadyT>15?'READY?':'GO!';
    G.textAlign='center';G.textBaseline='middle';
    
    const ph=sentryReadyT>15?(30-sentryReadyT)/15:(15-sentryReadyT)/15,sc=1+Math.max(0,.4-ph)*1.2;
    G.translate(OX,OY);G.scale(sc,sc);G.globalAlpha=Math.min(1,ph*4+.2);
    G.font='bold italic '+hpx(32)+'px '+FN;G.fillStyle=P.yel;G.fillText(msg,0,0);
    G.restore();
  }

  // Pause overlay
  if(pauseA>.01){
    G.save();G.globalAlpha=pauseA;G.beginPath();G.arc(OX,OY,R,0,TAU);G.clip();
    G.fillStyle='rgba(0,0,0,.82)';G.fillRect(0,0,S,S);
    G.textAlign='center';G.textBaseline='middle';
    G.font=`bold italic ${fpx(26)}px `+FN;G.fillStyle=P.lav;G.fillText('PAUSED',OX,OY-R*.42);
    G.strokeStyle='rgba(43,101,226,.18)';G.lineWidth=1;
    const pw=G.measureText('PAUSED').width*.5+24;
    const pul=OY-R*.42+(isMobile?24:18);G.beginPath();G.moveTo(OX-pw,pul);G.lineTo(OX+pw,pul);G.stroke();
    const pauseItems=['RESUME',RUN?'MAP':'MAIN MENU','OPTIONS'];
    // Pause items, vertically centred
    const pauseStart=OY-PAUSE_SP;
    pauseItems.forEach((item,i)=>{
      const py=pauseStart+i*PAUSE_SP,sel=pauseSel===i;
      if(sel){
        G.font=`bold italic ${fpx(20)}px `+FN;G.fillStyle=P.yel;G.fillText(item,OX,py);
        G.strokeStyle=P.yel+'22';G.lineWidth=1;G.beginPath();G.moveTo(OX-R*.3,py+(isMobile?20:14));G.lineTo(OX+R*.3,py+(isMobile?20:14));G.stroke();
      }else{G.font=`italic ${fpx(15)}px `+FN;G.fillStyle=P.blu+'88';G.fillText(item,OX,py);}
    });
    hint('↑↓  NAVIGATE  ·  SPACE  SELECT  ·  X  RESUME','TAP TO SELECT  ·  II  RESUMES');
    G.restore();
  }
}

// Y2K-inspired: italic, large, arcs, scanlines, decorative circles
function menuBg(){
  G.fillStyle='#000';G.fillRect(0,0,S,S);

  G.save();G.beginPath();G.arc(OX,OY,R,0,TAU);G.clip();

  if(!simple){

    const t1=Math.sin(menuT),t2=Math.sin(menuT*1.3+1.1);

    rg.addColorStop(0,`rgba(43,101,226,${(t1*.5+.5)*.09})`);
    rg.addColorStop(.55,`rgba(197,35,172,${(t2*.5+.5)*.04})`);
    rg.addColorStop(1,'rgba(0,0,0,0)');
    G.fillStyle=rg;G.fillRect(-R,-R,S+R*2,S+R*2);

    // Nested concentric rings at varying radii and opacities, vector depth
    [.94,.78,.60,.42].forEach((rf,idx)=>{
      const pulse=Math.sin(menuT*.8+idx*.9)*.5+.5;
      G.strokeStyle=`rgba(43,101,226,${.04+pulse*.06})`;

      G.beginPath();G.arc(OX,OY,R*rf,0,TAU);G.stroke();
    });

    // Two slow counter-rotating dashed arcs, neo-70s vinyl record feel
    G.setLineDash([5,12]);
    G.strokeStyle=`rgba(197,35,172,${.06+Math.sin(menuT*.6)*.03})`;G.lineWidth=1;
    G.beginPath();G.arc(OX,OY,R*.70,menuT*.10,menuT*.10+Math.PI*1.3);G.stroke();
    G.strokeStyle=`rgba(43,101,226,${.06+Math.sin(menuT*.7+2)*.03})`;
    G.beginPath();G.arc(OX,OY,R*.70,-menuT*.07,-menuT*.07+Math.PI*1.0);G.stroke();
    G.setLineDash([]);

    // Subtle radial spokes from centre (like a vinyl label)
    G.strokeStyle='rgba(43,101,226,.03)';G.lineWidth=1;
    for(let i=0;i<12;i++){
      const a=i/12*TAU+menuT*.02;
      G.beginPath();G.moveTo(OX+Math.cos(a)*R*.08,OY+Math.sin(a)*R*.08);
      G.lineTo(OX+Math.cos(a)*R*.92,OY+Math.sin(a)*R*.92);G.stroke();
    }
  }
  // Floating background score numbers, dim, decorative
  {const scores=LB[menuScoreMode]||[];if(scores.length){
    G.textBaseline='middle';G.textAlign='center';
    scores.slice(0,5).forEach((v,i)=>{
      const a=menuT*.06+i/5*TAU,d=R*(0.28+i*.1);
      const nx=OX+Math.cos(a)*d,ny=OY+Math.sin(a)*d;
      const sz=Math.round(9+i*2); // largest entry = largest text
      G.font=`italic ${sz}px `+FN;
      const modeCol={'arcade':P.sky,'sweep':P.yel,'purist':P.wht,'sentry':P.mag,'quarantine':P.grn}[menuScoreMode]||P.sky;
      G.fillStyle=modeCol+'18';G.fillText(v.toLocaleString(),nx,ny);
    });
  }}

  G.restore();

  // Outer ring, glowing frame
  
  G.strokeStyle=`rgba(43,101,226,${.35+Math.sin(menuT)*.1})`;G.lineWidth=1.5;
  G.beginPath();G.arc(OX,OY,R,0,TAU);G.stroke();
  // Black mask outside
  G.strokeStyle='#000';G.lineWidth=8;G.beginPath();G.arc(OX,OY,R+4,0,TAU);G.stroke();
}

function glyph(kind,s){
  G.beginPath();
  if(kind==='rock'){const k=[1,.8,1.05,.75,.95,.85,1];for(let i=0;i<7;i++){const a=i/7*TAU;G.lineTo(Math.cos(a)*s*k[i],Math.sin(a)*s*k[i]);}G.closePath();G.stroke();}
  else if(kind==='orbit'||kind==='deep'){const rr=kind==='deep'?s*.55:s;G.arc(0,0,rr,0,TAU);G.stroke();G.beginPath();G.arc(0,0,s*.22,0,TAU);G.fill();G.beginPath();G.arc(rr*.71,-rr*.71,s*.2,0,TAU);G.fill();}
  else if(kind==='push'){for(let k=1;k<=3;k++){G.beginPath();G.arc(0,0,s*k/3,-.9,.9);G.stroke();G.beginPath();G.arc(0,0,s*k/3,Math.PI-.9,Math.PI+.9);G.stroke();}}
  else if(kind==='wave'){for(const dx of[-.45,.25]){G.beginPath();G.moveTo(dx*s,-s*.7);G.lineTo((dx+.45)*s,0);G.lineTo(dx*s,s*.7);G.stroke();}}
  else if(kind==='sling'){G.arc(0,0,s*.75,Math.PI*.15,Math.PI*1.55);G.stroke();G.beginPath();G.moveTo(s*.65,-s*.6);G.lineTo(s,-s*.95);G.moveTo(s,-s*.95);G.lineTo(s*.95,-s*.45);G.stroke();G.beginPath();G.arc(0,0,s*.18,0,TAU);G.fill();}
  else if(kind==='comet'){G.ellipse(s*.35,s*-.35,s*.4,s*.22,-Math.PI/4,0,TAU);G.stroke();for(const o of[-.15,0,.15]){G.beginPath();G.moveTo(s*(.05+o),s*(-.05+o));G.lineTo(s*(-.8+o),s*(.8+o));G.stroke();}}
  else if(kind==='tidal'){G.arc(0,0,s*.3,0,TAU);G.fill();G.beginPath();G.arc(0,0,s*.85,0,TAU);G.setLineDash([3,3]);G.stroke();G.setLineDash([]);}
  else if(kind==='hole'){G.arc(0,0,s*.4,0,TAU);G.stroke();G.beginPath();G.arc(0,0,s*.75,-.4,1.4);G.stroke();G.beginPath();G.arc(0,0,s*.75,Math.PI-.4,Math.PI+1.4);G.stroke();}
  else if(kind==='shield'){for(let i=0;i<5;i++){G.beginPath();G.arc(0,0,s*.8,i/5*TAU+.12,(i+1)/5*TAU-.12);G.stroke();}G.beginPath();G.moveTo(s*.5,0);G.lineTo(-s*.35,s*.3);G.lineTo(-s*.2,0);G.lineTo(-s*.35,-s*.3);G.closePath();G.stroke();}
  else if(kind==='score'){for(let i=0;i<3;i++){G.fillRect(-s*.7+i*s*.5,s*.6-(i+1)*s*.4,s*.32,(i+1)*s*.4);}}
  else if(kind==='mult'){G.font=`bold italic ${Math.round(s*1.2)}px `+FN;G.textAlign='center';G.textBaseline='middle';G.fillText('×8',0,1);}
  else if(kind==='star'){for(let i=0;i<8;i++){const a=i/8*TAU-Math.PI/2,rr=i%2?s*.38:s;G.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}G.closePath();G.stroke();}
}
function badge(x,y,a,got,sel,sc=1){
  const col=TIER[a[3]][1],rr=(isMobile?30:24)*sc;
  G.save();G.translate(x,y);
  if(sel){G.strokeStyle=P.yel;G.lineWidth=1.4;G.beginPath();G.arc(0,0,rr+7+Math.sin(menuT*4)*1.5,0,TAU);G.stroke();}
  G.beginPath();for(let i=0;i<6;i++){const t=i/6*TAU+Math.PI/6;G.lineTo(Math.cos(t)*rr,Math.sin(t)*rr);}G.closePath();
  if(got){G.fillStyle=col+'2e';G.fill();G.strokeStyle=col;G.lineWidth=2;}else{G.strokeStyle='rgba(140,181,237,.25)';G.lineWidth=1.2;}
  G.stroke();
  G.strokeStyle=got?col:'rgba(140,181,237,.3)';G.fillStyle=G.strokeStyle;G.lineWidth=1.4;
  glyph(a[4],rr*.5);
  G.restore();
}

function bindLayout(){
  const sp=lsp(25),y0=OY-R*.42,ys=[];
  for(let i=0;i<ACTIONS.length;i++)ys.push(y0+i*sp);
  ys.push(y0+(ACTIONS.length+.6)*sp,y0+(ACTIONS.length+1.6)*sp);
  return{ys,sp,lx:OX-R*.52,sx:[OX+R*.14,OX+R*.42],sw:R*.25};
}

function drawScores(){
  menuScoreMode=(['arcade','sweep','purist','sentry','quarantine'][scoreSel])||'arcade';
  menuBg();G.textAlign='center';G.textBaseline='middle';
  const modes=[{key:'arcade',label:'ARCADE',col:P.sky},{key:'sweep',label:'MINESWEEPER',col:P.yel},{key:'purist',label:'PURIST',col:P.wht},{key:'sentry',label:'SENTRY',col:P.mag},{key:'quarantine',label:'QUARANTINE',col:P.grn}];
  const cur=modes[scoreSel];
  const entries=LB[cur.key];

  // ── Tab selector: 5 modes in two rows (3 top, 2 bottom) ──
  // Use abbreviated labels so they fit within the disc chord
  const tabAbbr=['ARC','SWEEP','PURIST','SENTRY','QRTN'];
  const tabRow1=[0,1,2], tabRow2=[3,4]; // indices split across rows
  const tabY1=OY-R*.62, tabY2=tabY1+lsp(22);

  // Row 1: 3 tabs
  tabRow1.forEach(ti=>{
    const {col}=modes[ti];
    const tx=OX+(ti-1)*R*.52;
    const tsel=ti===scoreSel;
    G.textAlign='center';
    if(tsel){
      
      G.font=`bold italic ${fpx(13)}px `+FN;G.fillStyle=col;G.fillText(tabAbbr[ti],tx,tabY1);
      G.strokeStyle=col;G.lineWidth=2;
      const tw2=G.measureText(tabAbbr[ti]).width*.5+6;
      G.beginPath();G.moveTo(tx-tw2,tabY1+10);G.lineTo(tx+tw2,tabY1+10);G.stroke();
    } else {
      G.font=`italic ${fpx(11)}px `+FN;G.fillStyle=col+'55';G.fillText(tabAbbr[ti],tx,tabY1);
    }
  });
  // Row 2: 2 tabs
  tabRow2.forEach((ti,ri)=>{
    const {col}=modes[ti];
    const tx=OX+(ri-.5)*R*.52;
    const tsel=ti===scoreSel;
    G.textAlign='center';
    if(tsel){
      
      G.font=`bold italic ${fpx(13)}px `+FN;G.fillStyle=col;G.fillText(tabAbbr[ti],tx,tabY2);

      const tw2=G.measureText(tabAbbr[ti]).width*.5+6;
      G.beginPath();G.moveTo(tx-tw2,tabY2+10);G.lineTo(tx+tw2,tabY2+10);G.stroke();

      G.font=`italic ${fpx(11)}px `+FN;G.fillStyle=col+'55';G.fillText(tabAbbr[ti],tx,tabY2);
    }

  G.strokeStyle=cur.col+'44';G.lineWidth=1;G.beginPath();G.moveTo(OX-R*.68,sepY);G.lineTo(OX+R*.68,sepY);G.stroke();

    G.font=`italic ${fpx(15)}px `+FN;G.fillStyle='rgba(43,101,226,.35)';
    G.fillText('NO SCORES YET',OX,OY);
  } else {
    const entryStartY=sepY+lsp(22);

      const ey=entryStartY+i*lsp(26);

// ── Loop ──────────────────────────────────────────────────────────────────────
// The game simulates at a fixed 30 Hz and draws at up to 60 fps, blending each
// object between its last two positions so motion stays smooth.
const STEP=1000/30;let last=0,acc=0,lastDraw=0,rAvg=0,gapAvg=16.7,lowFps=false;
const lerpLists=()=>[rocks,bullets,ufoBullets,comets,ufos,pulsers,hexes,swirls,activeMines,minePUs,hypPUs,spreadPUs,particles,popups];
function snap(){
  for(const L of lerpLists())for(const o of L){o._ix=o.x;o._iy=o.y;}
  for(const r of rocks)r.prot=r.rot;
  if(ship){ship._ix=ship.x;ship._iy=ship.y;ship._ia=ship.a;}
}
const _held=[];
function lerpOn(al){
  _held.length=0;
  const f=o=>{
    if(o._ix===undefined)return;
    o._x=o.x;o._y=o.y;_held.push(o);
    const dx=o.x-o._ix,dy=o.y-o._iy;
    if(dx*dx+dy*dy<2500){o.x=o._ix+dx*al;o.y=o._iy+dy*al;} // skip blending across a wrap or warp
  };
  for(const L of lerpLists())for(const o of L)f(o);
  for(const r of rocks)if(r.prot!==undefined){r._rot=r.rot;r.rot=r.prot+(r.rot-r.prot)*al;}
  if(ship){f(ship);if(ship._ia!==undefined&&Math.abs(ship.a-ship._ia)<1){ship._a=ship.a;ship.a=ship._ia+(ship.a-ship._ia)*al;}}
}
function lerpOff(){
  for(const o of _held){o.x=o._x;o.y=o._y;}
  for(const r of rocks)if(r._rot!==undefined){r.rot=r._rot;r._rot=undefined;}
  if(ship&&ship._a!==undefined){ship.a=ship._a;ship._a=undefined;}
}
function tick(){
  menuT+=.038;if(overT>0)overT--;
  if(bindMsg&&--bindMsg.t<=0)bindMsg=null;
  if(gScreen==='playing'&&!paused){
    if(hitStop>0)hitStop--;else{update();latch.clear();}
    if(slowMo>0)slowMo--;
    ageFx();
  }else latch.clear();
}
function render(al){
  if(isMobile)updateTCVis();
  pauseA+=((gScreen==='playing'&&paused?1:0)-pauseA)*ease(.3);
  if(gScreen!==scrKey){if(scrKey)iris=1;scrKey=gScreen;}
  const mt=menuT,live=gScreen==='playing';
  ral=live?(hitStop>0?1:al):0;menuT+=al*.038;
  if(live)lerpOn(ral);
  if(gScreen==='playing')drawGame();
  else if(gScreen==='over')drawGameOverMenu();
  else if(gScreen==='menu')drawMainMenu();
  else if(gScreen==='options')drawOptions();
  else if(gScreen==='stats')drawStats();
  else if(gScreen==='controls')drawControls();
  else if(gScreen==='map')drawMap();
  else if(gScreen==='credits')drawCredits();
  else if(gScreen==='brief')drawBrief();
  else if(gScreen==='binds')drawBinds();
  else if(gScreen==='ach')drawAch();
  else drawScores();
  if(live)lerpOff();
  menuT=mt;
  bloom();scanlines();
  // Iris: each new screen opens out from the centre of the disc
  if(iris>0){
    const rr=R*(1-iris*iris);
    G.save();G.fillStyle='#000';G.beginPath();G.arc(OX,OY,R+6,0,TAU);G.arc(OX,OY,Math.max(0,rr),0,TAU,true);G.fill();
    G.strokeStyle='rgba(140,181,237,.5)';G.lineWidth=1.5;G.beginPath();G.arc(OX,OY,Math.max(0,rr),0,TAU);G.stroke();G.restore();
    iris=Math.max(0,iris-.14*rdt/16.67);
  }
}
// Bloom: shrink the finished frame in halving steps, then add the soft copies back
// on top. One cheap pass replaces dozens of per-shape blurs.
const BL=[1,2,3].map(k=>{const c=document.createElement('canvas');c.width=c.height=Math.max(1,(S*DPR/2**k)|0);const g=c.getContext('2d',{alpha:false});g.imageSmoothingEnabled=true;return{c,g};});
function bloom(){
  if(simple||!CFG.glow)return;
  const gk=[0,.5,1,1.35][CFG.glow];
  let src=CVS;
  for(const b of BL){b.g.drawImage(src,0,0,b.c.width,b.c.height);src=b.c;}
  G.save();G.setTransform(1,0,0,1,0,0);G.globalCompositeOperation='lighter';G.imageSmoothingEnabled=true;
  G.globalAlpha=Math.min(1,.65*gk);G.drawImage(BL[1].c,0,0,CVS.width,CVS.height);
  G.globalAlpha=Math.min(1,.8*gk);G.drawImage(BL[2].c,0,0,CVS.width,CVS.height);
  G.restore();
}
// Scanlines and vignette, painted once at device resolution
const SCAN=(()=>{const c=document.createElement('canvas');c.width=c.height=CVS.width;const g=c.getContext('2d');
  g.fillStyle='rgba(0,0,0,.22)';const st=Math.max(2,Math.round(3*DPR));for(let y=0;y<c.height;y+=st)g.fillRect(0,y,c.width,Math.max(1,Math.round(DPR)));
  const h=c.width/2,vg=g.createRadialGradient(h,h,h*.55,h,h,h*.98);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');g.fillStyle=vg;g.fillRect(0,0,c.width,c.height);
  return c;})();
function scanlines(){if(!CFG.scan)return;G.save();G.setTransform(1,0,0,1,0,0);G.drawImage(SCAN,0,0);G.restore();}
// 30 fps drawing when forced in Options, or (on Auto) once the device proves it can't hold 60
function lowFx(){return CFG.fps===2||CFG.fps===0&&lowFps;}
function loop(ts){
  const step=slowMo>0&&CFG.slowmo?STEP*2:STEP; // death slow motion stretches each tick
  if(last&&!lowFps)gapAvg=gapAvg*.97+Math.min(ts-last,100)*.03;
  acc+=last?Math.min(ts-last,250):step;last=ts;
  let n=0;while(acc>=step&&n<12){snap();tick();acc-=step;n++;}
  if(n===12)acc=0;
  // Devices that can't draw at 60 drop to drawing once per update
  if(ts-lastDraw>=15.5&&(!lowFx()||n>0)){
    rdt=Math.min(100,ts-lastDraw)||16.67;lastDraw=ts;const t0=performance.now();render(lowFx()?1:Math.min(acc/step,1));
    rAvg=rAvg*.9+(performance.now()-t0)*.1;
    if(!lowFps&&CFG.fps===0&&(rAvg>9||gapAvg>26))lowFps=true; // once a device can't hold 60, stay at 30
  }
  requestAnimationFrame(loop);
}
achProg('camp',clearedCount()); // in case an older save already cleared it all
requestAnimationFrame(loop);
</script>
